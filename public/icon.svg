<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium, deep realistic outer shadow for the white circle to match high-end mobile app icons -->
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- Unified, realistic raised 3D shadow for the brand marks to give a tactile layered feel -->
    <filter id="elementShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <!-- Radial gradient for the blue dome background, providing rich saturation and high-end depth -->
    <radialGradient id="blueGrad" cx="50%" cy="30%" r="65%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#2a75ee"/>
      <stop offset="100%" stop-color="#0b3fa1"/>
    </radialGradient>

    <!-- Warm golden-orange gradient for the sleek travel arrow -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#e68a00"/>
    </linearGradient>

    <!-- Rich crimson gradient for the location map pin -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc1111"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer premium white circle with deep realistic soft shadow -->
  <circle cx="256" cy="256" r="240" fill="#ffffff" filter="url(#outerShadow)" />

  <!-- 2. Inner royal blue circle with vibrant radial gradient -->
  <circle cx="256" cy="256" r="224" fill="url(#blueGrad)" />

  <!-- 3. High-end edge highlight ring for a premium glazed/bevel look -->
  <circle cx="256" cy="256" r="221" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.14" />

  <!-- 4. Main logo elements group with integrated 3D elevation shadow -->
  <g filter="url(#elementShadow)">
    
    <!-- Red Map Pin (Location Marker) positioned perfectly to align with the arrowhead -->
    <path d="M 368,280 
             C 350,258 346,248 346,235 
             A 22,22 0 1 1 390,235 
             C 390,248 386,258 368,280 Z" 
          fill="url(#pinGrad)" />
    <!-- White dot inside the map pin -->
    <circle cx="368" cy="235" r="8" fill="#ffffff" />

    <!-- Letter 'E' - Rendered with professional rounded cap-style strokes for an ultra-clean look -->
    <path d="M 228,179 L 169,179 L 169,281 L 228,281 M 169,230 L 213,230" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Letter 'T' - Perfectly matched and aligned custom typography -->
    <path d="M 263,179 L 343,179 M 303,179 L 303,281" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Golden Smile-Arrow Shaft -->
    <path d="M 150,320 C 190,375 285,375 325,320" 
          fill="none" 
          stroke="url(#arrowGrad)" 
          stroke-width="18" 
          stroke-linecap="round" />

    <!-- Sharp, fully continuous Arrowhead pointing up-right - drawn on top to ensure zero cutoff -->
    <path d="M 355,290 L 310,315 Q 328,322 335,345 Z" 
          fill="url(#arrowGrad)" 
          stroke="url(#arrowGrad)" 
          stroke-width="3" 
          stroke-linejoin="round" />

  </g>
</svg>
