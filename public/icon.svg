<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft, deep realistic outer shadow for the white circle to match high-end mobile app icons -->
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- Realistic raised 3D shadow for the elements inside (ET, arrow, pin) -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <!-- Radial gradient for the blue background to give it a premium, glossy 3D dome look -->
    <radialGradient id="blueGrad" cx="50%" cy="30%" r="65%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#2a75ee"/>
      <stop offset="100%" stop-color="#0b3fa1"/>
    </radialGradient>

    <!-- Gradient for the golden smile arrow -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#e68a00"/>
    </linearGradient>

    <!-- Gradient for the red map pin -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc1111"/>
    </linearGradient>
  </defs>

  <!-- Outer white circle with a premium soft drop shadow -->
  <circle cx="256" cy="256" r="240" fill="#ffffff" filter="url(#outerShadow)" />

  <!-- Inner blue circle with premium radial gradient -->
  <circle cx="256" cy="256" r="224" fill="url(#blueGrad)" />

  <!-- High-end inner edge highlight ring for a glazed/metallic bevel effect -->
  <circle cx="256" cy="256" r="221" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.12" />

  <!-- Logo Group containing ET, smile arrow, and pin with a unified 3D shadow -->
  <g filter="url(#elementShadow)">
    <!-- Shift the entire group of professional elements 18px to the right and 24px down to achieve perfect visual center and optical balance -->
    <g transform="translate(18, 24)">
      
      <!-- Letter 'E' - Clean, modern sans-serif vector strokes with proportional size and thickness -->
      <path d="M 205,150 L 145,150 L 145,270 L 205,270" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="28" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 145,210 L 192,210" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="28" 
            stroke-linecap="round" />

      <!-- Letter 'T' - Perfectly matched and aligned custom typography -->
      <path d="M 245,150 L 315,150" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="28" 
            stroke-linecap="round" />
      <path d="M 280,150 L 280,270" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="28" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Smile-Arrow Shaft (Golden Yellow Gradient) - Beautifully wrapping the centered ET -->
      <path d="M 120,315 C 160,375 290,375 330,310" 
            fill="none" 
            stroke="url(#arrowGrad)" 
            stroke-width="18" 
            stroke-linecap="round" />

      <!-- Sharp, fully continuous Arrowhead pointing up-right perfectly continuous with the smile curve -->
      <polygon points="356,284 312,298 340,332" 
               fill="url(#arrowGrad)" 
               stroke="url(#arrowGrad)" 
               stroke-width="3" 
               stroke-linejoin="round" />

      <!-- Red Map Pin (Location Marker) pointing directly to the arrowhead tip, beautifully scaled -->
      <path d="M 370,280 
               C 342,252 338,241 338,225 
               A 22,22 0 1 1 402,225 
               C 402,241 398,252 370,280 Z" 
            fill="url(#pinGrad)" />
      <!-- White dot inside the map pin -->
      <circle cx="370" cy="225" r="8" fill="#ffffff" />

    </g>
  </g>
</svg>
